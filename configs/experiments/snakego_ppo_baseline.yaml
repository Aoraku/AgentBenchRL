game:
  max_round: 512
algorithms:
  ppo:
    learning_rate: 0.0003
    weight_decay: 0.0
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    entropy_coefficient: 0.01
    max_grad_norm: 0.5
    hidden_size: 256
    conv_channels: 64
    residual_blocks: 0
    recurrent: true
    gru_hidden_size: 256
    vector_envs: 8
    episodes_per_collect: 128
    minibatch_size: 1024
    update_repetitions: 8
    shaping_beta: 0.1
    score_scale: 513.0
    snapshot_interval: 10
    max_snapshots: 32
    device: cpu
training:
  seed: 260806
  iterations: 2000
evaluation:
  seeds: [101, 211, 307, 401, 503, 601, 701, 809]
  move_seconds: 3.0
resources:
  sample: true
run:
  output_dir: snakego-ppo-baseline
