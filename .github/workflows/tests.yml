name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m "not gpu" -q
      - run: python -m build
      - run: >-
          python scripts/verify_built_wheel.py
          dist/agentbench_rl_frame-0.1.0-py3-none-any.whl
          --sdist dist/agentbench_rl_frame-0.1.0.tar.gz
